<table border="0" cellpadding="0" cellspacing="0" height = "70">
    <tr>
        <td width = "50" valign="middle">
            <font color="silver" size="-1">start time</font><br />
            <font color="white" size="+1">{time}</font>
        </td>
        <td width = "{title_column_width}">
            <font color="white" size="+1"><b>{name}</b></font><br/>
            <font color="silver" size="-1">on map </font><font color="GoldenRod"><b>{map}</b></font><br/>
            <font color="silver"><b>mod : </b></font><font color="white"><b>{mod}</b></font>
            <font color="#666" size="-1">&nbsp;&nbsp;&nbsp;&nbsp;{availability}</font>
        </td>
        <td>
            <font color="silver"><b>duration</b></font><br/>
            <font color="white"><b>{duration}</b></font>
        </td>
    </tr>
</table>
