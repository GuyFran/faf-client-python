<table border="0" cellpadding="0" cellspacing="0" height="70">
    <tr>
        <td width="50" valign="middle">
            <font color="{default_color}" size="-1">start time</font><br />
            <font color="{time_color}" size="+1">{time}</font>
        </td>
        <td width="{title_column_width}">
            <font color="{title_color}" size="+1"><b>{name}</b></font><br/>
            <font color="{default_color}" size="-1">on map </font><font color="{map_color}"><b>{map}</b></font><br/>
            <font color="{default_color}"><b>mod : </b></font><font color="{mod_color}"><b>{mod}</b></font>
            <font color="{availability_color}" size="-1">&nbsp;&nbsp;&nbsp;&nbsp;{availability}</font>
        </td>
        <td>
            <font color="{default_color}"><b>duration</b></font><br/>
            <font color="{duration_color}"><b>{duration}</b></font>
            <font color="{status_color}"><b>{status}</b></font>
        </td>
    </tr>
</table>
