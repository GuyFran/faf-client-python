<font color="{title_color}" size="+2">
    <b>{title}</b>
</font>
<br/>
<font color="{color}" size="-1">on map</font>&nbsp; <font color="{map_color}">
    <b>{mapdisplayname}</b>
</font>
<table border="0" cellpadding="0" cellspacing="0" width="250">
    <tbody>
        <tr>
            <td>
                <font color="{color}">
                    <font size="-1">with</font>&nbsp; <b>{players} / {mapslots} {playerstring}</b>
            </td>
            <td align="right">
                <font color="{color}" size="-1">Age</font>
                <font color="{color}">{age}</font>
            </td>
        </tr>
        <tr>
            <td>
                <font size="-1" color="{mods_color}">mod</font>&nbsp; <font color="{title_color}">
                    <b>{mod}</b>
                </font>
            </td>
            <td align="right">
                <font size="-1" color="{mods_color}">
                    <b>{simmods}</b>
                </font>
            </td>
        </tr>
        <tr>
            <td>
                <font color="{color}" size="-1">by</font>&nbsp;
                <font color="{host_color}">
                    <b>{host}</b>
                </font>
            </td>
            <td align="right">
                <b>
                    <font color="{color}" size="-1">Avg. Rating</font>
                    <font color="{color}" size="+1">{avgrating}</font>
                </b>
            </td>
        </tr>
    </tbody>
</table>
